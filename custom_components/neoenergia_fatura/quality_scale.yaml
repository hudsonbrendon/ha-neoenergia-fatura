rules:
  # Bronze
  action-setup:
    status: exempt
    comment: The integration does not provide actions.
  appropriate-polling: done
  brands:
    status: todo
    comment: Custom integration; no brand images submitted to home-assistant/brands.
  common-modules: done
  config-flow: done
  config-flow-test-coverage: done
  dependency-transparency: done
  docs-actions:
    status: exempt
    comment: The integration does not provide actions.
  docs-conditions:
    status: exempt
    comment: The integration does not provide conditions.
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: todo
  docs-triggers:
    status: exempt
    comment: The integration does not provide triggers.
  entity-event-setup:
    status: exempt
    comment: Entities only read coordinator data; no event subscriptions.
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup: done
  unique-config-entry: done

  # Silver
  action-exceptions:
    status: exempt
    comment: The integration does not provide actions.
  config-entry-unloading: done
  docs-configuration-parameters:
    status: exempt
    comment: No options flow.
  docs-installation-parameters: done
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable: done
  parallel-updates: done
  reauthentication-flow: todo
  test-coverage: todo

  # Gold
  devices: done
  diagnostics: done
  discovery:
    status: exempt
    comment: A mailbox cannot be discovered on the network.
  discovery-update-info:
    status: exempt
    comment: No discovery.
  docs-data-update: done
  docs-examples: todo
  docs-known-limitations: done
  docs-supported-devices: done
  docs-supported-functions: done
  docs-troubleshooting: todo
  docs-use-cases: done
  dynamic-devices:
    status: exempt
    comment: One config entry is one mailbox/account exposed as a single device.
  entity-category: todo
  entity-device-class: done
  entity-disabled-by-default: todo
  entity-translations: done
  exception-translations: todo
  icon-translations: todo
  reconfiguration-flow: todo
  repair-issues:
    status: exempt
    comment: Failures surface through entity availability; nothing needs a repair flow.
  stale-devices:
    status: exempt
    comment: One config entry is one device; removing the entry removes the device.

  # Platinum
  async-dependency:
    status: todo
    comment: imaplib and pypdf are synchronous and run in the executor.
  inject-websession:
    status: exempt
    comment: IMAP, no HTTP session.
  strict-typing: todo
